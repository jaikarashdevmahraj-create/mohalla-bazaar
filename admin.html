<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार Admin</span></div>
      <div class="header-links">
        <a href="index.html" class="about-link">🏠 होमपेज</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">
    <div id="authLoading" class="storefront-empty"><p>लोड हो रहा है...</p></div>
    <div id="notAdminBox" style="display:none;" class="storefront-empty"><p>❌ आपको यह पेज देखने की इजाज़त नहीं है।</p></div>

    <div id="pageContent" style="display:none;">
      <h1>🛠️ Admin पैनल</h1>

      <div class="stat-grid" id="adminStats"></div>

      <div class="order-tabs" id="adminTabs">
        <button type="button" class="order-tab active" data-tab="sellers">🏬 दुकानें</button>
        <button type="button" class="order-tab" data-tab="products">📦 सामान</button>
        <button type="button" class="order-tab" data-tab="orders">🧾 ऑर्डर</button>
        <button type="button" class="order-tab" data-tab="coupons">🎟️ कूपन</button>
      </div>

      <div id="adminContent"></div>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="admin.js"></script>
</body>
</html>

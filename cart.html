<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>कार्ट — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <a href="index.html" class="about-link">🏠 होमपेज</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <div id="authLoading" class="storefront-empty"><p>लोड हो रहा है...</p></div>

    <div id="pageContent" style="display:none;">

      <h1>🛒 आपका कार्ट</h1>
      <div id="cartItemsList"></div>

      <div class="section-box" id="cartSummary" style="display:none;">
        <div class="cart-total-row">
          <span>कुल राशि</span>
          <b id="cartTotalAmount">₹0</b>
        </div>
        <button type="button" class="btn-primary" id="checkoutBtn">आगे बढ़ें (डिलीवरी जानकारी भरें)</button>
      </div>

    </div>

  </div>

  <!-- ===== चेकआउट फॉर्म ===== -->
  <div class="modal-overlay" id="checkoutOverlay">
    <div class="modal">
      <h2>डिलीवरी की जानकारी भरें</h2>
      <p class="order-product-name" id="checkoutSummary"></p>
      <form id="checkoutForm">
        <label>आपका नाम</label>
        <input type="text" id="checkoutName" required placeholder="जैसे: रमेश कुमार">

        <label>मोबाइल नंबर</label>
        <input type="tel" id="checkoutPhone" required placeholder="जैसे: 98765 43210">

        <label>डिलीवरी पता</label>
        <input type="text" id="checkoutAddress" required placeholder="पूरा पता लिखें">

        <label>कोई खास सूचना (वैकल्पिक)</label>
        <input type="text" id="checkoutNote" placeholder="जैसे: शाम 5 बजे के बाद घर पर मिलूंगा">

        <button type="submit" class="btn-primary" id="checkoutSubmitBtn">सभी ऑर्डर भेजें</button>
        <button type="button" class="btn-secondary" id="cancelCheckout">रद्द करें</button>
      </form>
    </div>
  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="cart.js"></script>
</body>
</html>

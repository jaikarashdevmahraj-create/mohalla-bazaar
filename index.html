<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <button type="button" id="menuBtn" class="menu-btn" aria-label="मेन्यू">☰</button>
      <div class="logo">🏪 <span data-i18n="appName">मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <button type="button" id="langToggleBtn" class="lang-btn">EN</button>
        <a href="#" id="authLink" class="about-link" data-i18n="login">लॉगिन</a>
      </div>
    </div>
    <div class="location">📍 शास्त्री नगर, आपके 3 किमी के दायरे में</div>
    <div class="search-box">
      <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="क्या ढूंढ रहे हैं? जैसे 'टमाटर', 'कुर्ती'...">
    </div>
    <div class="sort-row">
      <select id="sortSelect">
        <option value="relevant" data-i18n="sortRelevant">सबसे ऊपर: प्रासंगिक</option>
        <option value="price_low" data-i18n="sortPriceLow">कीमत: कम से ज़्यादा</option>
        <option value="price_high" data-i18n="sortPriceHigh">कीमत: ज़्यादा से कम</option>
        <option value="newest" data-i18n="sortNewest">सबसे नया सामान</option>
      </select>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="side-menu-overlay" id="sideMenuOverlay">
    <div class="side-menu">
      <div class="side-menu-header">
        <span class="disp" data-i18n="menu">मेन्यू</span>
        <button type="button" id="closeMenuBtn" class="close-menu-btn">✕</button>
      </div>
      <a href="index.html" class="side-menu-item" data-i18n="menuHome">🏠 होम</a>
      <a href="cart.html" class="side-menu-item" data-i18n="menuCart">🛒 कार्ट</a>
      <a href="#" id="wishlistMenuLink" class="side-menu-item" data-i18n="menuWishlist">❤️ मेरी पसंद</a>
      <a href="#" id="ordersMenuLink" class="side-menu-item" data-i18n="menuOrders">📦 मेरे ऑर्डर</a>
      <a href="#" id="accountMenuLink" class="side-menu-item" data-i18n="menuAccount">👤 मेरा अकाउंट</a>
      <a href="seller.html" class="side-menu-item" data-i18n="menuSeller">🛍️ विक्रेता डैशबोर्ड</a>
      <a href="about.html" class="side-menu-item" data-i18n="menuAbout">ℹ️ हमारे बारे में</a>
    </div>
  </div>

  <div class="welcome-banner" id="welcomeBanner"></div>

  <div class="categories" id="categories"></div>

  <main class="grid" id="productGrid"></main>
  <button type="button" id="loadMoreBtn" class="edit-toggle-btn" style="display:none; margin:0 16px 20px;">और सामान दिखाएँ</button>

  <div class="modal-overlay" id="detailOverlay">
    <div class="modal" id="detailModal"></div>
  </div>

  <div class="zoom-overlay" id="zoomOverlay">
    <button type="button" class="zoom-close-btn" id="zoomCloseBtn">✕</button>
    <img id="zoomImg" alt="zoom">
  </div>

  <div class="modal-overlay" id="orderOverlay">
    <div class="modal">
      <h2>ऑर्डर की जानकारी भरें</h2>
      <p id="orderProductName" class="order-product-name"></p>
      <form id="orderForm">
        <label>कितनी मात्रा चाहिए?</label>
        <input type="number" id="orderQty" min="1" value="1" required>

        <label>आपका नाम</label>
        <input type="text" id="orderName" required placeholder="जैसे: रमेश कुमार">

        <label>मोबाइल नंबर</label>
        <input type="tel" id="orderPhone" required placeholder="जैसे: 98765 43210">

        <label>डिलीवरी पता (सामान कहाँ भेजना है)</label>
        <input type="text" id="orderAddress" required placeholder="पूरा पता लिखें">

        <label>कोई खास सूचना (वैकल्पिक)</label>
        <input type="text" id="orderNote" placeholder="जैसे: शाम 5 बजे के बाद घर पर मिलूंगा">

        <button type="submit" class="btn-primary" id="orderSubmitBtn">ऑर्डर भेजें</button>
        <button type="button" class="btn-secondary" id="cancelOrder">रद्द करें</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="paymentOverlay">
    <div class="modal">
      <h2>✅ ऑर्डर भेज दिया गया!</h2>
      <p class="premium-hint" id="paymentIntro">चाहें तो अभी UPI से भुगतान कर सकते हैं, या सामान मिलने पर नकद भी दे सकते हैं।</p>
      <div id="qrSection" style="text-align:center;"></div>
      <button type="button" class="btn-primary" id="markPaidBtn">मैंने UPI से भुगतान कर दिया है</button>
      <button type="button" class="btn-secondary" id="closePaymentPopup">बाद में / नकद देंगे</button>
    </div>
  </div>

  <script src="translations.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>

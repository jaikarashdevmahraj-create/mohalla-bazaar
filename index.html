<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <a href="seller.html" class="seller-link">🛍️ विक्रेता डैशबोर्ड</a>
        <a href="about.html" class="about-link">ℹ️ बारे में</a>
      </div>
    </div>
    <div class="location">📍 शास्त्री नगर, आपके 3 किमी के दायरे में</div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="क्या ढूंढ रहे हैं? जैसे 'टमाटर', 'कुर्ती'...">
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="categories" id="categories"></div>

  <main class="grid" id="productGrid"></main>

  <button class="fab" id="postBtn">+</button>

  <div class="modal-overlay" id="detailOverlay">
    <div class="modal" id="detailModal"></div>
  </div>

  <div class="modal-overlay" id="postOverlay">
    <div class="modal">
      <h2>अपना सामान लिस्ट करें</h2>
      <form id="postForm">
        <label>सामान का नाम</label>
        <input type="text" id="itemTitle" placeholder="जैसे: घर की बनी अचार बोतल" required>

        <label>कीमत (₹)</label>
        <input type="number" id="itemPrice" placeholder="जैसे: 150" required>

        <label>श्रेणी</label>
        <select id="itemCat"></select>

        <button type="submit" class="btn-primary">लिस्ट करें</button>
        <button type="button" class="btn-secondary" id="cancelPost">रद्द करें</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

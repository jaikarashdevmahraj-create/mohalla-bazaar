<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मोहल्ला बाज़ार</title>
  <style>
    body {
      margin: 0;
      font-family: 'Noto Sans Devanagari', sans-serif;
      background-color: #FAF5EA;
      color: #1A1A1A;
      text-align: center;
      padding: 60px 20px;
    }
    h1 {
      color: #1B2A4A;
      font-size: 32px;
    }
    p {
      color: #555;
      font-size: 16px;
    }
    .badge {
      display: inline-block;
      background-color: #E8A33D;
      color: #1B2A4A;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>🏪 मोहल्ला बाज़ार</h1>
  <p>आपके आसपास की खरीद-फरोख्त — जल्द आ रहा है</p>
  <div class="badge">वेबसाइट बन रही है 🚧</div>
</body>
</html>

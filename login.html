<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>लॉगिन — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span data-i18n="appName">मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <button type="button" id="langToggleBtn" class="lang-btn">EN</button>
        <a href="index.html" class="about-link" data-i18n="menuHome">🏠 होमपेज</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <div class="success-banner" id="successBanner"></div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tabLogin" data-i18n="loginTab">लॉगिन करें</button>
      <button type="button" class="auth-tab" id="tabSignup" data-i18n="signupTab">नया अकाउंट बनाएँ</button>
    </div>

    <div class="section-box" id="loginBox">
      <h3 data-i18n="loginTitle">अपने अकाउंट में लॉगिन करें</h3>
      <form id="loginForm">
        <label data-i18n="emailLabel">ईमेल</label>
        <input type="email" id="loginEmail" required placeholder="jaise: aap@example.com">

        <label data-i18n="passwordLabel">पासवर्ड</label>
        <input type="password" id="loginPassword" required placeholder="अपना पासवर्ड डालें">

        <a href="#" id="forgotPasswordLink" class="forgot-link" data-i18n="forgotPassword">पासवर्ड भूल गए?</a>

        <button type="submit" class="btn-primary" id="loginBtn" data-i18n="loginBtn">लॉगिन करें</button>
      </form>
    </div>

    <div class="section-box" id="signupBox" style="display:none;">
      <h3 data-i18n="signupTitle">नया अकाउंट बनाएँ</h3>
      <form id="signupForm">
        <label data-i18n="yourName">आपका नाम</label>
        <input type="text" id="signupName" required placeholder="जैसे: सुनीता देवी">

        <label data-i18n="emailLabel">ईमेल</label>
        <input type="email" id="signupEmail" required placeholder="jaise: aap@example.com">

        <label data-i18n="newPassword">पासवर्ड (कम से कम 6 अक्षर)</label>
        <input type="password" id="signupPassword" required minlength="6" placeholder="नया पासवर्ड बनाएँ">

        <label data-i18n="whoAreYou">आप कौन हैं?</label>
        <select id="signupRole">
          <option value="buyer" data-i18n="roleBuyer">🛒 ग्राहक (खरीदना है)</option>
          <option value="seller" data-i18n="roleSeller">🏬 विक्रेता (दुकान चलानी है)</option>
        </select>

        <button type="submit" class="btn-primary" id="signupBtn" data-i18n="signupBtn">अकाउंट बनाएँ</button>
      </form>
    </div>

    <p class="auth-note" data-i18n="authNote">🔒 यह जानकारी सुरक्षित रहती है और सिर्फ़ आपके अकाउंट की पहचान के लिए इस्तेमाल होगी।</p>

  </div>

  <script src="translations.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="login.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरे ऑर्डर — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <a href="index.html" class="about-link">🏠 होमपेज</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <div id="authLoading" class="storefront-empty"><p>लोड हो रहा है...</p></div>

    <div id="pageContent" style="display:none;">

      <h1>मेरे ऑर्डर</h1>
      <p class="seller-note">आपका अकाउंट: <b id="userEmailLabel"></b> · <a href="#" id="logoutLink">लॉगआउट</a></p>

      <button type="button" class="edit-toggle-btn" id="editProfileToggleBtn">✏️ मेरी जानकारी (नाम, फोन, पता) बदलें</button>

      <div class="section-box" id="buyerProfileBox" style="display:none;">
        <h3>मेरी जानकारी</h3>
        <form id="buyerProfileForm">
          <label>आपका नाम</label>
          <input type="text" id="buyerName" required placeholder="जैसे: रमेश कुमार">

          <label>मोबाइल नंबर</label>
          <input type="tel" id="buyerPhone" required placeholder="जैसे: 98765 43210">

          <label>आपका डिफ़ॉल्ट पता</label>
          <input type="text" id="buyerAddress" required placeholder="पूरा पता लिखें">

          <button type="submit" class="btn-primary" id="buyerProfileSubmitBtn">सेव करें</button>
        </form>
      </div>

      <div class="order-tabs" id="orderTabs">
        <button type="button" class="order-tab active" data-filter="all">सभी</button>
        <button type="button" class="order-tab" data-filter="pending">⏳ पेंडिंग</button>
        <button type="button" class="order-tab" data-filter="accepted">✅ स्वीकार</button>
        <button type="button" class="order-tab" data-filter="cancelled">❌ रद्द</button>
      </div>

      <div id="ordersList"></div>

      <!-- ===== रिव्यू लिखने वाला फॉर्म ===== -->
      <div class="modal-overlay" id="reviewOverlay">
        <div class="modal">
          <h2>अपना अनुभव बताएं</h2>
          <p class="order-product-name" id="reviewProductName"></p>
          <form id="reviewForm">
            <label>रेटिंग दें</label>
            <div class="star-picker" id="starPicker">
              <span data-star="1">⭐</span>
              <span data-star="2">⭐</span>
              <span data-star="3">⭐</span>
              <span data-star="4">⭐</span>
              <span data-star="5">⭐</span>
            </div>
            <input type="hidden" id="reviewRating" value="0">

            <label>अपना अनुभव लिखें (वैकल्पिक)</label>
            <input type="text" id="reviewComment" placeholder="जैसे: सामान अच्छा और समय पर मिला">

            <button type="submit" class="btn-primary" id="reviewSubmitBtn">रिव्यू भेजें</button>
            <button type="button" class="btn-secondary" id="cancelReview">रद्द करें</button>
          </form>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="my-orders.js"></script>
</body>
</html>

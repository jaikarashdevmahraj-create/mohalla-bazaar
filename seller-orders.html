<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरे ऑर्डर — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <a href="seller.html" class="about-link">📊 डैशबोर्ड</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <div id="authLoading" class="storefront-empty"><p>लोड हो रहा है...</p></div>

    <div id="pageContent" style="display:none;">

      <h1>मेरे ऑर्डर</h1>
      <p class="seller-note">यहाँ आपकी दुकान के सारे ऑर्डर दिखेंगे — स्वीकार करें या रद्द करें।</p>

      <!-- ===== ऑर्डर के आंकड़े ===== -->
      <div class="stat-grid" id="orderStats"></div>

      <!-- ===== फ़िल्टर टैब ===== -->
      <div class="order-tabs" id="orderTabs">
        <button type="button" class="order-tab active" data-filter="pending">⏳ पेंडिंग</button>
        <button type="button" class="order-tab" data-filter="accepted">✅ स्वीकार</button>
        <button type="button" class="order-tab" data-filter="cancelled">❌ रद्द</button>
        <button type="button" class="order-tab" data-filter="all">सभी</button>
      </div>

      <!-- ===== ऑर्डर लिस्ट ===== -->
      <div id="ordersList"></div>

      <!-- ===== रद्द करने का कारण पूछने वाला पॉपअप ===== -->
      <div class="modal-overlay" id="cancelReasonOverlay">
        <div class="modal">
          <h2>रद्द करने का कारण</h2>
          <form id="cancelReasonForm">
            <label>कारण चुनें</label>
            <select id="cancelReasonSelect">
              <option value="स्टॉक खत्म हो गया">स्टॉक खत्म हो गया</option>
              <option value="डिलीवरी क्षेत्र से बाहर">डिलीवरी क्षेत्र से बाहर</option>
              <option value="ग्राहक से संपर्क नहीं हो पाया">ग्राहक से संपर्क नहीं हो पाया</option>
              <option value="गलत जानकारी/ऑर्डर">गलत जानकारी/ऑर्डर</option>
              <option value="अन्य">अन्य कारण</option>
            </select>

            <label>अतिरिक्त जानकारी (वैकल्पिक)</label>
            <input type="text" id="cancelReasonNote" placeholder="कोई और जानकारी लिखें">

            <button type="submit" class="delete-account-btn" style="margin-top:16px;">रद्द करना पक्का करें</button>
            <button type="button" class="btn-secondary" id="cancelReasonCancel">वापस जाएँ</button>
          </form>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="seller-orders.js"></script>
</body>
</html>

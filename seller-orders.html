<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरे ऑर्डर — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <a href="seller.html" class="about-link">📊 डैशबोर्ड</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <div id="authLoading" class="storefront-empty"><p>लोड हो रहा है...</p></div>

    <div id="pageContent" style="display:none;">

      <h1>मेरे ऑर्डर</h1>
      <p class="seller-note">यहाँ आपकी दुकान के सारे ऑर्डर दिखेंगे — स्वीकार करें या रद्द करें।</p>

      <!-- ===== ऑर्डर के आंकड़े ===== -->
      <div class="stat-grid" id="orderStats"></div>

      <!-- ===== फ़िल्टर टैब ===== -->
      <div class="order-tabs" id="orderTabs">
        <button type="button" class="order-tab active" data-filter="pending">⏳ पेंडिंग</button>
        <button type="button" class="order-tab" data-filter="accepted">✅ स्वीकार</button>
        <button type="button" class="order-tab" data-filter="cancelled">❌ रद्द</button>
        <button type="button" class="order-tab" data-filter="all">सभी</button>
      </div>

      <!-- ===== ऑर्डर लिस्ट ===== -->
      <div id="ordersList"></div>

    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="seller-orders.js"></script>
</body>
</html>

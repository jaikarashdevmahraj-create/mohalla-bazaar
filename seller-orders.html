<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>मेरे ऑर्डर — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span data-i18n="appName">मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <button type="button" id="langToggleBtn" class="lang-btn">EN</button>
        <a href="seller.html" class="about-link" data-i18n="dashboardLink">📊 डैशबोर्ड</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <div id="authLoading" class="storefront-empty"><p data-i18n="loading">लोड हो रहा है...</p></div>

    <div id="pageContent" style="display:none;">

      <h1 data-i18n="myOrdersTitle">मेरे ऑर्डर</h1>
      <p class="seller-note" data-i18n="ordersSubtitle">यहाँ आपकी दुकान के सारे ऑर्डर दिखेंगे — स्वीकार करें या रद्द करें।</p>

      <div class="stat-grid" id="orderStats"></div>

      <div class="order-tabs" id="orderTabs">
        <button type="button" class="order-tab active" data-filter="pending" data-i18n="tabPending">⏳ पेंडिंग</button>
        <button type="button" class="order-tab" data-filter="accepted" data-i18n="tabAccepted">✅ स्वीकार</button>
        <button type="button" class="order-tab" data-filter="packed" data-i18n="tabPacked">📦 पैक</button>
        <button type="button" class="order-tab" data-filter="out_for_delivery" data-i18n="tabOutForDelivery">🚚 डिलीवरी पर</button>
        <button type="button" class="order-tab" data-filter="delivered" data-i18n="tabDelivered">🏠 डिलीवर हुआ</button>
        <button type="button" class="order-tab" data-filter="cancelled" data-i18n="tabCancelled">❌ रद्द</button>
        <button type="button" class="order-tab" data-filter="all" data-i18n="tabAll">सभी</button>
      </div>

      <div id="ordersList"></div>

      <div class="modal-overlay" id="cancelReasonOverlay">
        <div class="modal">
          <h2 data-i18n="cancelReasonTitle">रद्द करने का कारण</h2>
          <form id="cancelReasonForm">
            <label data-i18n="reasonSelect">कारण चुनें</label>
            <select id="cancelReasonSelect">
              <option value="स्टॉक खत्म हो गया">स्टॉक खत्म हो गया</option>
              <option value="डिलीवरी क्षेत्र से बाहर">डिलीवरी क्षेत्र से बाहर</option>
              <option value="ग्राहक से संपर्क नहीं हो पाया">ग्राहक से संपर्क नहीं हो पाया</option>
              <option value="गलत जानकारी/ऑर्डर">गलत जानकारी/ऑर्डर</option>
              <option value="अन्य">अन्य कारण</option>
            </select>

            <label data-i18n="reasonExtra">अतिरिक्त जानकारी (वैकल्पिक)</label>
            <input type="text" id="cancelReasonNote" placeholder="कोई और जानकारी लिखें">

            <button type="submit" class="delete-account-btn" style="margin-top:16px;" data-i18n="confirmCancel">रद्द करना पक्का करें</button>
            <button type="button" class="btn-secondary" id="cancelReasonCancel" data-i18n="goBack">वापस जाएँ</button>
          </form>
        </div>
      </div>

    </div>

  </div>

  <script src="translations.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="seller-orders.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>दुकानें — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span data-i18n="appName">मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <button type="button" id="langToggleBtn" class="lang-btn">EN</button>
        <a href="index.html" class="about-link" data-i18n="homeLink">🏠 होमपेज</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">
    <h1 data-i18n="sellersDirectoryTitle">🏬 दुकानें</h1>

    <div class="order-tabs" id="sellerTabs">
      <button type="button" class="order-tab active" data-tab="famous" data-i18n="tabFamous">⭐ मशहूर</button>
      <button type="button" class="order-tab" data-tab="nearby" data-i18n="tabNearby">📍 आस-पास</button>
      <button type="button" class="order-tab" data-tab="followed" data-i18n="tabFollowed">❤️ फॉलो की गईं</button>
    </div>

    <div id="sellerListBox"></div>
  </div>

  <script src="translations.js"></script>
  <script type="module" src="firebase-config.js"></script>
  <script type="module" src="sellers.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>विक्रेता डैशबोर्ड — मोहल्ला बाज़ार</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="header-top">
      <div class="logo">🏪 <span>मोहल्ला बाज़ार</span></div>
      <div class="header-links">
        <a href="seller-profile.html" class="seller-link">🏬 मेरी दुकान</a>
        <a href="index.html" class="about-link">🏠 होमपेज</a>
      </div>
    </div>
    <div class="stripe">
      <span style="background:#E8A33D"></span>
      <span style="background:#B33A3A"></span>
      <span style="background:#3B6E5E"></span>
      <span style="background:#E8A33D"></span>
      <span style="background:#3B6E5E"></span>
    </div>
  </header>

  <div class="seller-page">

    <h1 id="pageTitle">विक्रेता डैशबोर्ड</h1>
    <p class="seller-note">यह डेटा अभी सिर्फ़ आपके इस फोन/ब्राउज़र में सेव है।</p>

    <div id="premiumCard"></div>

    <div class="stat-grid" id="statGrid"></div>

    <div class="section-box" id="advancedSection"></div>

    <div class="section-box">
      <h3>श्रेणी के हिसाब से सामान</h3>
      <div id="catBars"></div>
    </div>

    <div class="section-box">
      <h3 id="formTitle">नया सामान जोड़ें</h3>
      <p class="limit-note" id="limitNote"></p>
      <form id="sellerForm">
        <label>सामान का नाम</label>
        <input type="text" id="pName" required placeholder="जैसे: देसी टमाटर">

        <label>कीमत (₹ प्रति यूनिट)</label>
        <input type="number" id="pPrice" required placeholder="जैसे: 40">

        <label>यूनिट (किस हिसाब से बेच रहे हैं)</label>
        <select id="pUnit">
          <option value="पीस">पीस (नग)</option>
          <option value="किलो">किलो (kg)</option>
          <option value="ग्राम">ग्राम (g)</option>
          <option value="लीटर">लीटर (L)</option>
          <option value="दर्जन">दर्जन</option>
          <option value="पैकेट">पैकेट</option>
          <option value="बॉक्स">बॉक्स</option>
        </select>

        <label>स्टॉक में कितनी मात्रा है</label>
        <input type="number" id="pStock" required placeholder="जैसे: 25">

        <label>श्रेणी</label>
        <select id="pCat">
          <option value="sabzi">🥕 सब्ज़ी-राशन</option>
          <option value="kapde">👕 कपड़े</option>
          <option value="ghar">🛋️ घरेलू सामान</option>
          <option value="electronics">🔌 इलेक्ट्रॉनिक्स</option>
          <option value="handmade">🧶 हस्तशिल्प</option>
        </select>

        <label>सामान की फोटो</label>
        <div class="upload-row">
          <input type="file" accept="image/*" id="pImgFile" class="file-input">
          <label for="pImgFile" class="upload-btn">🖼️ गैलरी से फोटो चुनें</label>
        </div>
        <div class="img-preview-wrap" id="imgPreviewWrap" style="display:none;">
          <img id="pImgPreview" alt="preview">
          <button type="button" id="removeImgBtn" class="remove-img-btn">✕ हटाएँ</button>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">सामान जोड़ें</button>
        <button type="button" class="btn-secondary" id="cancelEdit" style="display:none;">एडिट रद्द करें</button>
      </form>
    </div>

    <div class="section-box">
      <h3>मेरा सामान (<span id="countLabel">0</span>)</h3>
      <div id="myProducts"></div>
    </div>

  </div>

  <script type="module" src="firebase-config.js"></script>
  <script src="seller.js"></script>
</body>
</html>
